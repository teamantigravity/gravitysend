name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_VERSION: "1.93.1"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Symlink Rust for Xcode
        run: |
          sudo ln -s ~/.cargo/bin/cargo /usr/local/bin/cargo
          sudo ln -s ~/.cargo/bin/rustc /usr/local/bin/rustc

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Disable Swift Package Manager
        working-directory: app
        run: flutter config --no-enable-swift-package-manager

      - name: Build iOS (No Codesign) with auto-versioning
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} > build_log.txt 2>&1

      - name: Create Issue on Failure
        if: failure()
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_CONTENT=$(tail -n 200 build_log.txt)
          gh issue create --title "iOS Build Failed" --body "\`\`\`text
          $LOG_CONTENT
          \`\`\`"

      - name: Package iOS Build
        working-directory: app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../../gravitysend-ios.zip Runner.app

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: gravitysend-ios.zip
