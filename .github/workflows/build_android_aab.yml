name: Build Android App Bundle (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_VERSION: "1.93.1"
  NDK_VERSION: "r27c"

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust/Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rust/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('app/rust/Cargo.lock', 'app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Decode keystore
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEY_STORE" ]; then
            mkdir -p app/android
            echo "$ANDROID_KEY_STORE" | base64 --decode --ignore-garbage > app/android/gravitysend.jks
            echo "storePassword=gravitysend123" > app/android/key.properties
            echo "keyPassword=gravitysend123" >> app/android/key.properties
            echo "keyAlias=gravitysend" >> app/android/key.properties
            echo "storeFile=../gravitysend.jks" >> app/android/key.properties
          fi

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build App Bundle (AAB) with auto-versioning
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gravitysend-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
