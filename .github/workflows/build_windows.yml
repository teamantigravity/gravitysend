name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_VERSION: "1.93.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      issues: write

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Unhide AppData for cargokit symlinks
        run: attrib -H "$env:USERPROFILE\AppData"

      - name: Build Windows with auto-versioning
        working-directory: app
        run: |
          flutter build windows --release -v --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} > build_log.txt 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: app/build_log.txt

      - name: Copy Visual C++ runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll    build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Package Windows Installer
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" scripts\compile_windows_exe-inno.iss
          Move-Item dist\windows\GravitySend-Windows-Setup.exe dist\windows\GravitySend-1.0.${{ github.run_number }}-windows-x64.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/GravitySend-*-windows-x64.exe
