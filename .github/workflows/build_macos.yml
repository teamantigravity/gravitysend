name: Build macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.0"
  RUST_VERSION: "1.93.1"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Symlink Rust for Xcode
        run: |
          sudo ln -s ~/.cargo/bin/cargo /usr/local/bin/cargo
          sudo ln -s ~/.cargo/bin/rustc /usr/local/bin/rustc

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Disable Swift Package Manager
        working-directory: app
        run: flutter config --no-enable-swift-package-manager

      - name: Build macOS with auto-versioning
        working-directory: app
        run: |
          set -o pipefail
          flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} > build_log.txt 2>&1

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: app/build_log.txt

      - name: Package macOS Build
        working-directory: app
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../gravitysend-macos.zip GravitySend.app

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: gravitysend-macos.zip
