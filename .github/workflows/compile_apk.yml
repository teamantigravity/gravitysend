name: Compile APK

on:
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub Actions tab

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.25.0' # Matches the version in pubspec.yaml
          channel: 'stable'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.84.1'

      # ----------------------------------------------------------------------
      # KEYSTORE SETUP
      # ----------------------------------------------------------------------
      - name: Decode key.properties
        if: ${{ env.ANDROID_KEY_PROPERTIES != '' }}
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ANDROID_KEY_PROPERTIES" | base64 -d > app/android/key.properties

      - name: Decode android-keystore.jks
        if: ${{ env.ANDROID_KEY_STORE != '' }}
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p secrets
          echo "$ANDROID_KEY_STORE" | base64 -d > secrets/android-keystore.jks

      - name: Fetch Flutter Dependencies
        working-directory: app
        run: flutter pub get

      # ----------------------------------------------------------------------
      # BUILD APK
      # We default to a Debug APK so you can test it immediately without keys.
      # Change --debug to --release when you add your signing keys.
      # ----------------------------------------------------------------------
      - name: Build Debug APK for Testing
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravitysend-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
