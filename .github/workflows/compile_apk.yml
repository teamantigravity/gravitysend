name: Compile APK

on:
  workflow_dispatch: # Manually trigger from the GitHub Actions tab

env:
  FLUTTER_VERSION: "3.38.10"
  RUST_VERSION: "1.93.1"

jobs:
  build_debug_apk:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rust/.cargo
            app/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Decode key.properties (if secret exists)
        if: ${{ env.ANDROID_KEY_PROPERTIES != '' }}
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ANDROID_KEY_PROPERTIES" | base64 -d > app/android/key.properties

      - name: Decode android-keystore.jks (if secret exists)
        if: ${{ env.ANDROID_KEY_STORE != '' }}
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p secrets
          echo "$ANDROID_KEY_STORE" | base64 -d > secrets/android-keystore.jks

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Debug APK
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --debug --verbose

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gravitysend-debug-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  build_release_aab:
    name: Build Android Release AAB (Play Store)
    runs-on: ubuntu-24.04
    # Only runs if signing secrets are set
    if: ${{ vars.BUILD_RELEASE == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/rust/.cargo
            app/target
          key: ${{ runner.os }}-cargo-release-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-

      - name: Decode key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ANDROID_KEY_PROPERTIES" | base64 -d > app/android/key.properties

      - name: Decode android-keystore.jks
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p secrets
          echo "$ANDROID_KEY_STORE" | base64 -d > secrets/android-keystore.jks

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Release APKs (split per ABI)
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (AAB)
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build appbundle --release

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gravitysend-release-apks-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: gravitysend-release-aab-${{ github.run_number }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
