name: Release Draft

# Trigger manually from the GitHub Actions tab
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.10"
  RUST_VERSION: "1.93.1"

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS REQUIRED FOR SIGNED RELEASE BUILDS:
#   ANDROID_KEY_PROPERTIES  — base64-encoded key.properties file
#   ANDROID_KEY_STORE       — base64-encoded .jks keystore file
#   GITHUB_TOKEN            — automatically provided by GitHub
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Get version ─────────────────────────────────────────────────────────────
  get_version:
    name: Read version from pubspec.yaml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # ── Android APKs (arm32, arm64, x64) + AAB ──────────────────────────────────
  build_android:
    name: Build Android (APK + AAB)
    needs: get_version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-android-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-${{ env.RUST_VERSION }}-

      - name: Decode key.properties
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "$ANDROID_KEY_PROPERTIES" | base64 -d > app/android/key.properties
            echo "Signing keystore configured"
          else
            echo "No keystore secret found — release build will use debug signing"
          fi

      - name: Decode android-keystore.jks
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$ANDROID_KEY_STORE" ]; then
            mkdir -p secrets
            echo "$ANDROID_KEY_STORE" | base64 -d > secrets/android-keystore.jks
          fi

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APKs (split per ABI)
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (AAB for Play Store)
        working-directory: app
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build appbundle --release

      - name: Rename APK artifacts
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             app/GravitySend-$VERSION-android-arm32.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             app/GravitySend-$VERSION-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk \
             app/GravitySend-$VERSION-android-x64.apk
          cp app/build/app/outputs/bundle/release/app-release.aab \
             app/GravitySend-$VERSION-android-playstore.aab

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/GravitySend-*-android-arm32.apk
            app/GravitySend-*-android-arm64.apk
            app/GravitySend-*-android-x64.apk
            app/GravitySend-*-android-playstore.aab
          retention-days: 7

  # ── Windows ZIP ──────────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows (ZIP)
    needs: get_version
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build for Windows
        working-directory: app
        run: flutter build windows --release

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add runtime DLLs
        working-directory: app
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Zip release folder
        working-directory: app
        run: |
          $version = "${{ needs.get_version.outputs.version }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath "GravitySend-$version-windows-x64.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: app/GravitySend-*-windows-x64.zip
          retention-days: 7

  # ── Linux x86_64 TAR.GZ ─────────────────────────────────────────────────────
  build_linux:
    name: Build Linux x86_64 (tar.gz)
    needs: get_version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev ninja-build \
            libayatana-appindicator3-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release

      - name: Create tar.gz archive
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd app/build/linux/x64/release/bundle
          tar -czvf ../../../../../GravitySend-$VERSION-linux-x86_64.tar.gz *

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: app/GravitySend-*-linux-x86_64.tar.gz
          retention-days: 7

  # ── Create GitHub Release ────────────────────────────────────────────────────
  create_release:
    name: Create GitHub Release Draft
    needs:
      - get_version
      - build_android
      - build_windows
      - build_linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: GravitySend v${{ needs.get_version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## GravitySend v${{ needs.get_version.outputs.version }}

            Send files. No cloud. No limits.

            ### Downloads
            | Platform | File |
            |---|---|
            | Android (arm64, recommended) | `GravitySend-*-android-arm64.apk` |
            | Android (arm32) | `GravitySend-*-android-arm32.apk` |
            | Android (x64) | `GravitySend-*-android-x64.apk` |
            | Google Play Store | `GravitySend-*-android-playstore.aab` |
            | Windows (x64) | `GravitySend-*-windows-x64.zip` |
            | Linux (x86_64) | `GravitySend-*-linux-x86_64.tar.gz` |

            ### Privacy Policy
            https://gravitysend.com/privacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
